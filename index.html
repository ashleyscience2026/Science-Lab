<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Science Lab - Grade 9</title>

<style>

/* =========================
   SCIENCE LAB RED & WHITE THEME
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #252525;
  line-height: 1.6;
}

/* HEADER */

header {
  background: #a6192e;
  color: white;
  text-align: center;
  padding: 25px 20px;
  border-bottom: 6px solid #7d1021;
}

header h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: 1px;
}

header p {
  margin: 5px 0 0;
  font-size: 18px;
}

/* MAIN */

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* CARDS */

.card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  margin-bottom: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  border-top: 5px solid #a6192e;
}

h1 {
  color: #a6192e;
}

h2 {
  color: #a6192e;
}

h3 {
  color: #7d1021;
}

/* BUTTONS */

button {
  background: #a6192e;
  color: white;
  border: none;
  padding: 13px 21px;
  border-radius: 9px;
  font-size: 17px;
  cursor: pointer;
  margin: 7px 3px;
  transition: .2s;
}

button:hover {
  background: #7d1021;
  transform: translateY(-1px);
}

.secondary {
  background: #333333;
}

.secondary:hover {
  background: #111111;
}

/* MULTIPLE CHOICE */

.option {
  display: block;
  width: 100%;
  text-align: left;
  background: white;
  color: #252525;
  border: 2px solid #d9d9d9;
  margin: 10px 0;
}

.option:hover {
  background: #fff3f4;
  border-color: #a6192e;
  color: #7d1021;
}

.correct {
  background: #e2f4e7 !important;
  border-color: #3d9254 !important;
  color: #245c32 !important;
}

.incorrect {
  background: #ffe5e8 !important;
  border-color: #c62828 !important;
  color: #8a1111 !important;
}

/* INPUTS */

textarea,
input {
  width: 100%;
  padding: 13px;
  border: 2px solid #cccccc;
  border-radius: 9px;
  font-size: 17px;
  margin-top: 8px;
  font-family: Arial, Helvetica, sans-serif;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

textarea:focus,
input:focus {
  outline: none;
  border-color: #a6192e;
  box-shadow: 0 0 0 2px #f5d8dd;
}

/* VISUAL */

.visual {
  background: #fff4f5;
  border: 2px solid #f0c7cd;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  font-size: 45px;
  margin: 20px 0;
}

/* TABLE */

.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  background: white;
}

.data-table th,
.data-table td {
  border: 1px solid #cccccc;
  padding: 12px;
  text-align: center;
}

.data-table th {
  background: #a6192e;
  color: white;
}

.data-table tr:nth-child(even) {
  background: #fafafa;
}

.data-table input {
  width: 90px;
  text-align: center;
}

/* VOCABULARY */

.vocab {
  background: #fafafa;
  border-left: 5px solid #a6192e;
  padding: 14px;
  margin: 12px 0;
}

/* CALLOUT */

.callout {
  background: #fff8f8;
  border-left: 6px solid #a6192e;
  padding: 16px;
  margin: 17px 0;
}

/* CER */

.cer-box {
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
}

.claim-box {
  background: #fff1f3;
  border-left: 7px solid #a6192e;
}

.evidence-box {
  background: #f5f5f5;
  border-left: 7px solid #555555;
}

.reasoning-box {
  background: #fff8e5;
  border-left: 7px solid #d39b00;
}

/* PROGRESS BAR */

.progress {
  height: 14px;
  background: #dddddd;
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 14px;
  background: #a6192e;
  width: 0%;
  border-radius: 10px;
  transition: width .3s;
}

/* CENTER */

.center {
  text-align: center;
}

/* SIMULATION */

.simulation {
  border: 3px solid #a6192e;
  border-radius: 15px;
  padding: 25px;
  background: #fffafa;
  text-align: center;
}

.water-container {
  width: 170px;
  height: 230px;
  border: 5px solid #666666;
  border-top: none;
  margin: 20px auto;
  position: relative;
  background: white;
}

.water {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #45a9e8;
  transition: height 1s;
}

.sun {
  font-size: 55px;
}

.result {
  font-size: 21px;
  font-weight: bold;
  margin: 15px;
}

/* FEEDBACK */

.check-result {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
}

.success {
  background: #e2f4e7;
  border: 2px solid #3d9254;
}

.try-again {
  background: #ffe9e9;
  border: 2px solid #c62828;
}

/* MOBILE */

@media (max-width: 700px) {

  header h1 {
    font-size: 29px;
  }

  .card {
    padding: 18px;
  }

  .data-table {
    font-size: 13px;
  }

  .data-table th,
  .data-table td {
    padding: 7px;
  }

  .data-table input {
    width: 65px;
  }

}

</style>

</head>

<body>

<header>

<h1>🔬 SCIENCE LAB</h1>

<p>
Earth & Universe Science • Grade 9
</p>

</header>

<div class="container">

<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>

<div id="app"></div>

</div>


<script>

/* =========================
   LESSON NAVIGATION
========================= */

let currentStep = 0;

const steps = [
"welcome",
"engage",
"reading",
"explore",
"explain",
"elaborate",
"cer",
"complete"
];

function updateProgress() {

let percent =
(currentStep / (steps.length - 1)) * 100;

document.getElementById("progressBar").style.width =
percent + "%";

}

function show(step) {

currentStep = steps.indexOf(step);

updateProgress();

if(step === "welcome") welcome();
if(step === "engage") engage();
if(step === "reading") reading();
if(step === "explore") explore();
if(step === "explain") explain();
if(step === "elaborate") elaborate();
if(step === "cer") cer();
if(step === "complete") complete();

}

/* =========================

let simulationResults = {

15: 96,

25: 87,

35: 75

};

let trialsRun = {

15: false,

25: false,

35: false

};


function explore() {

document.getElementById("app").innerHTML = `

</p>

</th>

<td>

id="end15"

placeholder="mL">

</td>

<td>

<input
id="lost15"
type="number"
placeholder="mL">

</td>

</tr>

<tr>

<td>25°C</td>

<td>100 mL</td>

<td>

<input
id="end25"

placeholder="mL">

</td>

<td>

<input

type="number"
placeholder="mL">

</td>

</tr>

<tr>

<td>35°C</td>

<td>100 mL</td>

<td>

<input
id="end35"
type="number"
placeholder="mL">

</td>

<td>

<input
id="lost35"

placeholder="mL">

</td>

</tr>

</table>

<div class="callout">

<p>

</p>

id="pattern"
placeholder="As temperature increased..."
></textarea>

<button onclick="show('explain')">

Continue →

</button>

</div>

`;

}


function runSimulation(temp) {

let endingWater =
simulationResults[temp];

trialsRun[temp] = true;

document.getElementById("water").style.height =
endingWater + "%";

document.getElementById("simResult").innerHTML =

`

<strong>
Trial: ${temp}°C
</strong>

<br><br>

Your observed ending water level is:

<br><br>

<strong>
${endingWater} mL
</strong>

<br><br>

📝 Record
<strong>
${endingWater} mL
</strong>
in your data table.

<br><br>

Now calculate:

<br>

100 mL − ${endingWater} mL = ?

`;

}


function checkDataTable() {

let end15 =
Number(document.getElementById("end15").value);

let lost15 =
Number(document.getElementById("lost15").value);

let end25 =
Number(document.getElementById("end25").value);

let lost25 =
Number(document.getElementById("lost25").value);

let end35 =
Number(document.getElementById("end35").value);

let lost35 =
Number(document.getElementById("lost35").value);

let correct = true;

let messages = [];


if(
!trialsRun[15] ||
!trialsRun[25] ||
!trialsRun[35]
) {

messages.push(
"⚠️ Run all three temperature trials before checking your data."
);

correct = false;

}


if(end15 !== 96) {

messages.push(
"Check the ending water for the 15°C trial."
);

correct = false;

}


if(lost15 !== 4) {

messages.push(
"Check your calculation for water lost at 15°C."
);

correct = false;

}


if(end25 !== 87) {

messages.push(
"Check the ending water for the 25°C trial."
);

correct = false;

}


if(lost25 !== 13) {

messages.push(
"Check your calculation for water lost at 25°C."
);

correct = false;

}


if(end35 !== 75) {

messages.push(
"Check the ending water for the 35°C trial."
);

correct = false;

}


if(lost35 !== 25) {

messages.push(
"Check your calculation for water lost at 35°C."
);

correct = false;

}


let feedback =
document.getElementById("tableFeedback");


if(correct) {

feedback.innerHTML = `

<div
class="check-result success">

<h3>✅ Data Complete!</h3>

<p>

You correctly recorded your observations
and calculated the amount of water lost.

</p>

<p>

Now look for a pattern in your data.

</p>

</div>

`;

}

else {

feedback.innerHTML = `

<div
class="check-result try-again">

<h3>🔎 Keep Investigating</h3>

${messages
.map(message => `<p>${message}</p>`)
.join("")}

<p>

Scientists check their data carefully.
Review your measurements and calculations,
then try again.

</p>

</div>

`;

}

}

"Correct! This evidence connects temperature with the amount of water lost."

);

}

else {

button.classList.add("incorrect");

alert(

"Look for evidence that shows a relationship between temperature and water loss."

);

}

}
