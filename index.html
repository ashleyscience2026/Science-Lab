<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Science Lab | Grade 9</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #222;
  line-height: 1.6;
}

/* =========================
   HEADER
========================= */

header {
  background: #a6192e;
  color: white;
  padding: 22px;
  text-align: center;
  border-bottom: 6px solid #7d1021;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin: 5px 0 0;
}

/* =========================
   LAYOUT
========================= */

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  border-top: 5px solid #a6192e;
}

/* =========================
   NAVIGATION
========================= */

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
}

button {
  background: #a6192e;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #7d1021;
}

button:disabled {
  background: #bbb;
  cursor: not-allowed;
}

.secondary {
  background: #444;
}

.secondary:hover {
  background: #222;
}

/* =========================
   PROGRESS
========================= */

.progress {
  height: 13px;
  background: #ddd;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #a6192e;
  transition: width .3s;
}

/* =========================
   TEXT
========================= */

h2,
h3 {
  color: #a6192e;
}

.callout {
  background: #fff3f5;
  border-left: 6px solid #a6192e;
  padding: 15px;
  margin: 18px 0;
}

.vocab {
  background: #fafafa;
  border-left: 5px solid #a6192e;
  padding: 14px;
  margin: 12px 0;
}

/* =========================
   VISUAL
========================= */

.visual {
  background: #fff3f5;
  border: 2px solid #efc4cb;
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  font-size: 45px;
  margin: 20px 0;
}

/* =========================
   INPUTS
========================= */

textarea,
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 2px solid #ccc;
  border-radius: 8px;
  margin-top: 7px;
  font-family: Arial, Helvetica, sans-serif;
}

textarea {
  min-height: 110px;
}

textarea:focus,
input:focus {
  outline: none;
  border-color: #a6192e;
}

/* =========================
   OPTIONS
========================= */

.option {
  width: 100%;
  text-align: left;
  background: white;
  color: #222;
  border: 2px solid #ccc;
  margin: 8px 0;
}

.option:hover {
  background: #fff3f5;
  color: #7d1021;
}

.correct {
  background: #e2f4e7 !important;
  border-color: #3d9254 !important;
}

.incorrect {
  background: #ffe5e8 !important;
  border-color: #c62828 !important;
}

/* =========================
   DATA TABLE
========================= */

.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
}

.data-table th,
.data-table td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}

.data-table th {
  background: #a6192e;
  color: white;
}

.data-table input {
  width: 90px;
  text-align: center;
}

/* =========================
   CER
========================= */

.cer-box {
  padding: 20px;
  border-radius: 12px;
  margin: 18px 0;
}

.claim {
  background: #fff0f2;
  border-left: 7px solid #a6192e;
}

.evidence {
  background: #f5f5f5;
  border-left: 7px solid #555;
}

.reasoning {
  background: #fff8df;
  border-left: 7px solid #d29a00;
}

/* =========================
   NOTEBOOK
========================= */

.notebook {
  background: white;
  border: 3px solid #a6192e;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.notebook h3 {
  border-bottom: 2px solid #eee;
  padding-bottom: 5px;
}

/* =========================
   HELP / EXTENSION
========================= */

.help {
  background: #fff4e5;
  border-left: 6px solid #e19a00;
  padding: 16px;
  margin-top: 15px;
}

.extension {
  background: #eef6ff;
  border-left: 6px solid #2474b5;
  padding: 16px;
  margin-top: 15px;
}

/* =========================
   CENTER
========================= */

.center {
  text-align: center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  header h1 {
    font-size: 27px;
  }

  .card {
    padding: 18px;
  }

  .navigation {
    flex-direction: column;
  }

}

</style>
</head>

<body>

<header>

<h1>🔬 SCIENCE LAB</h1>

<p>Earth & Universe Science • Grade 9</p>

</header>

<div class="container">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="app"></div>

</div>

<script>

/* =====================================================
   STUDENT NOTEBOOK
   Everything students type is saved automatically.
===================================================== */

const STORAGE_KEY = "scienceLabWeek1";

let studentWork =
JSON.parse(localStorage.getItem(STORAGE_KEY)) || {

prediction: "",
readingAnswer: "",
end15: "",
lost15: "",
end25: "",
lost25: "",
end35: "",
lost35: "",
pattern: "",
causeEffect: "",
comparison: "",
claim: "",
evidence: "",
reasoning: ""

};


/* SAVE */

function saveWork() {

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(studentWork)
);

}


/* UPDATE A RESPONSE */

function updateWork(field, value) {

studentWork[field] = value;

saveWork();

}


/* =====================================================
   LESSON STEPS
===================================================== */

const steps = [

"welcome",
"engage",
"reading",
"explore",
"explain",
"elaborate",
"cer",
"notebook"

];

let currentStep = 0;


/* =====================================================
   NAVIGATION
===================================================== */

function show(step) {

currentStep = steps.indexOf(step);

updateProgress();

if(step === "welcome") welcome();
if(step === "engage") engage();
if(step === "reading") reading();
if(step === "explore") explore();
if(step === "explain") explain();
if(step === "elaborate") elaborate();
if(step === "cer") cer();
if(step === "notebook") notebook();

}


/* PROGRESS */

function updateProgress() {

let percent =
(currentStep / (steps.length - 1)) * 100;

document.getElementById(
"progressBar"
).style.width = percent + "%";

}


/* =====================================================
   NAVIGATION BUTTONS
===================================================== */

function navigation(previous, next) {

let backButton = previous
? `<button class="secondary" onclick="show('${previous}')">← Back</button>`
: `<button disabled>← Back</button>`;

let nextButton = next
? `<button onclick="show('${next}')">Continue →</button>`
: "";

return `

<div class="navigation">

${backButton}

<button
class="secondary"
onclick="show('notebook')">

📓 My Science Notebook

</button>

${nextButton}

</div>

`;

}


/* =====================================================
   WELCOME
===================================================== */

function welcome() {

document.getElementById("app").innerHTML = `

<div class="card center">

<h2>UNIT 1 • WEEK 1</h2>

<h1>Where Did the Water Go?</h1>

<div class="visual">

💧 → ☁️

</div>

<h2>Essential Question</h2>

<p>

<strong>

How do scientists use evidence
to explain changes in the natural world?

</strong>

</p>

<p>

Today you will read, investigate data,
practice math, and write a scientific explanation.

</p>

<button onclick="show('engage')">

Begin Investigation →

</button>

</div>

`;

}


/* =====================================================
   ENGAGE
===================================================== */

function engage() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🔎 ENGAGE — The Mystery</h2>

<p>

A scientist places exactly
<strong>100 mL</strong>
of water in an open container.

</p>

<div class="visual">

🧪 💧

<br>

<strong>100 mL</strong>

</div>

<p>

Twenty-four hours later,
the scientist measures the water again.

</p>

<div class="visual">

🧪 💧

<br>

<strong>77 mL</strong>

</div>

<div class="callout">

<strong>

23 mL of water is no longer
in the container.

</strong>

</div>

<h2>🤔 Where did the water go?</h2>

<textarea
id="prediction"
placeholder="I think the water..."
oninput="updateWork('prediction',this.value)"
>${studentWork.prediction}</textarea>

${navigation(null,"reading")}

</div>

`;

}


/* =====================================================
   READING
===================================================== */

function reading() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>📖 READ — Scientific Reading</h2>

<p>

Your teacher will provide a printed
scientific reading about evaporation
and the water cycle.

</p>

<div class="callout">

<strong>Reading strategy:</strong>

<br>

As you read, underline:

<br><br>

🟥 The main idea

<br>

🟦 An important detail

<br>

🟩 Evidence that explains evaporation

</div>

<h3>Vocabulary</h3>

<div class="vocab">

<strong>Evaporation</strong>

<br>

The process in which a liquid changes
into a gas.

</div>

<div class="vocab">

<strong>Water vapor</strong>

<br>

Water in its gas state.

</div>

<div class="vocab">

<strong>Evidence</strong>

<br>

Information that helps support
a scientific explanation.

</div>

<h3>Reading Response</h3>

<p>

What happens to water during evaporation?

</p>

<textarea
placeholder="During evaporation..."
oninput="updateWork('readingAnswer',this.value)"
>${studentWork.readingAnswer}</textarea>

${navigation("engage","explore")}

</div>

`;

}


/* =====================================================
   EXPLORE
===================================================== */

let trialResults = {

15: 96,
25: 87,
35: 75

};

let completedTrials = {

15: false,
25: false,
35: false

};


function explore() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🔬 EXPLORE — Virtual Investigation</h2>

<h3>Investigation Question</h3>

<p>

<strong>

How does temperature affect
the amount of water that evaporates?

</strong>

</p>

<div class="callout">

Run all three trials.

<strong>

Record the ending water yourself.

</strong>

Then calculate the water lost.

</div>

<div class="visual">

☀️ 🧪 💧

</div>

<h3>Choose a Temperature</h3>

<button onclick="runTrial(15)">15°C</button>

<button onclick="runTrial(25)">25°C</button>

<button onclick="runTrial(35)">35°C</button>

<div id="trialResult"></div>

<h3>📊 Record Your Data</h3>

<table class="data-table">

<tr>

<th>Temperature</th>

<th>Starting Water</th>

<th>Ending Water</th>

<th>Water Lost</th>

</tr>

<tr>

<td>15°C</td>

<td>100 mL</td>

<td>

<input
type="number"
value="${studentWork.end15}"
oninput="updateWork('end15',this.value)"
>

</td>

<td>

<input
type="number"
value="${studentWork.lost15}"
oninput="updateWork('lost15',this.value)"
>

</td>

</tr>

<tr>

<td>25°C</td>

<td>100 mL</td>

<td>

<input
type="number"
value="${studentWork.end25}"
oninput="updateWork('end25',this.value)"
>

</td>

<td>

<input
type="number"
value="${studentWork.lost25}"
oninput="updateWork('lost25',this.value)"
>

</td>

</tr>

<tr>

<td>35°C</td>

<td>100 mL</td>

<td>

<input
type="number"
value="${studentWork.end35}"
oninput="updateWork('end35',this.value)"
>

</td>

<td>

<input
type="number"
value="${studentWork.lost35}"
oninput="updateWork('lost35',this.value)"
>

</td>

</tr>

</table>

<div class="callout">

<strong>Math Formula</strong>

<br><br>

Starting Water − Ending Water
= Water Lost

<br><br>

Example:

<br>

100 − 90 = 10 mL

</div>

<button onclick="checkData()">

Check My Data ✓

</button>

<div id="dataFeedback"></div>

<h3>📈 Data Analysis</h3>

<p>

What pattern do you notice as
temperature increases?

</p>

<textarea
placeholder="As temperature increased..."
oninput="updateWork('pattern',this.value)"
>${studentWork.pattern}</textarea>

${navigation("reading","explain")}

</div>

`;

}


/* RUN TRIAL */

function runTrial(temp) {

completedTrials[temp] = true;

let ending = trialResults[temp];

document.getElementById(
"trialResult"
).innerHTML = `

<div class="callout">

<h3>Trial: ${temp}°C</h3>

<p>

Ending water:

<strong>${ending} mL</strong>

</p>

<p>

📝 Record this number
in your data table.

</p>

<p>

Now calculate:

<br>

100 − ${ending} = ?

</p>

</div>

`;

}


/* CHECK DATA */

function checkData() {

let answers = {

end15: 96,
lost15: 4,

end25: 87,
lost25: 13,

end35: 75,
lost35: 25

};

let correct = true;

for(let key in answers) {

if(Number(studentWork[key]) !== answers[key]) {

correct = false;

}

}

let feedback =
document.getElementById("dataFeedback");

if(correct) {

feedback.innerHTML = `

<div class="extension">

<strong>⭐ Excellent!</strong>

<p>

Your data and calculations are correct.

</p>

<p>

Now try this challenge:

</p>

<p>

<strong>

How many more milliliters of water
were lost at 35°C than at 15°C?

</strong>

</p>

<p>

25 − 4 = ?

</p>

</div>

`;

}

else {

feedback.innerHTML = `

<div class="help">

<strong>🧠 Let's Practice</strong>

<p>

Remember:

</p>

<p>

<strong>

Starting Water − Ending Water
= Water Lost

</strong>

</p>

<p>

Try the 15°C trial first:

</p>

<p>

100 − 96 = ?

</p>

<p>

Then check your other calculations.

</p>

</div>

`;

}

}


/* =====================================================
   EXPLAIN
===================================================== */

function explain() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🧠 EXPLAIN</h2>

<h3>Observation or Inference?</h3>

<div class="vocab">

<strong>Observation</strong>

<br>

Something you directly see,
measure, or record.

</div>

<div class="vocab">

<strong>Inference</strong>

<br>

An explanation based on observations
and evidence.

</div>

<p>

A thermometer reads 25°C.

Is this an observation or an inference?

</p>

<button
class="option"
onclick="answerExplain(this,true)">

Observation

</button>

<button
class="option"
onclick="answerExplain(this,false)">

Inference

</button>

<div id="explainFeedback"></div>

<h3>Cause and Effect</h3>

<p>

Complete the sentence:

</p>

<p>

<strong>

As temperature increased,
________________________.

</strong>

</p>

<textarea
placeholder="As temperature increased..."
oninput="updateWork('causeEffect',this.value)"
>${studentWork.causeEffect}</textarea>

${navigation("explore","elaborate")}

</div>

`;

}


function answerExplain(button, correct) {

if(correct) {

button.classList.add("correct");

document.getElementById(
"explainFeedback"
).innerHTML = `

<div class="extension">

<strong>⭐ Correct!</strong>

<p>

Challenge:

Why is the statement
“the water evaporated” an inference?

</p>

<textarea></textarea>

</div>

`;

}

else {

button.classList.add("incorrect");

document.getElementById(
"explainFeedback"
).innerHTML = `

<div class="help">

<strong>🧠 Need Help?</strong>

<p>

An observation is something you can
directly measure or see.

</p>

<p>

A thermometer reading is a measurement.

Try again.

</p>

</div>

`;

}

}


/* =====================================================
   ELABORATE
===================================================== */

function elaborate() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🌎 ELABORATE — Apply Your Thinking</h2>

<p>

Two containers each begin with
100 mL of water.

</p>

<table class="data-table">

<tr>

<th>Location</th>

<th>Starting Water</th>

<th>Ending Water</th>

<th>Water Lost</th>

</tr>

<tr>

<td>Sunny Window</td>

<td>100 mL</td>

<td>72 mL</td>

<td>28 mL</td>

</tr>

<tr>

<td>Cabinet</td>

<td>100 mL</td>

<td>91 mL</td>

<td>9 mL</td>

</tr>

</table>

<h3>Math Challenge</h3>

<p>

How much more water was lost
in the sunny window?

</p>

<p>

<strong>

28 − 9 = ?

</strong>

</p>

<input
type="number"
id="mathChallenge"
placeholder="Answer in mL"
>

<button onclick="checkMath()">

Check Answer

</button>

<div id="mathFeedback"></div>

<h3>Writing</h3>

<p>

Compare the two locations
using their data.

</p>

<textarea
placeholder="The sunny window..."
oninput="updateWork('comparison',this.value)"
>${studentWork.comparison}</textarea>

${navigation("explain","cer")}

</div>

`;

}


function checkMath() {

let answer =
Number(document.getElementById("mathChallenge").value);

let feedback =
document.getElementById("mathFeedback");

if(answer === 19) {

feedback.innerHTML = `

<div class="extension">

<strong>⭐ Correct!</strong>

<p>

28 − 9 = 19 mL

</p>

<p>

Challenge:

What percentage of the original
100 mL was lost in the sunny window?

</p>

</div>

`;

}

else {

feedback.innerHTML = `

<div class="help">

<strong>🧠 Let's Practice</strong>

<p>

Look at the two amounts:

</p>

<p>

28 mL and 9 mL

</p>

<p>

Subtract the smaller number
from the larger number.

</p>

</div>

`;

}

}


/* =====================================================
   CER
===================================================== */

function cer() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>✍️ CER — Scientific Writing</h2>

<p>

Use your reading, observations,
math, and data to explain:

</p>

<h3>

Where did the missing water go?

</h3>

<div class="cer-box claim">

<h3>🟥 CLAIM</h3>

<p>

Answer the question in one sentence.

</p>

<textarea
placeholder="The missing water..."
oninput="updateWork('claim',this.value)"
>${studentWork.claim}</textarea>

</div>

<div class="cer-box evidence">

<h3>⬜ EVIDENCE</h3>

<p>

Give at least <strong>two pieces of evidence</strong>.

Use a number from your data.

</p>

<textarea
placeholder="My evidence is..."
oninput="updateWork('evidence',this.value)"
>${studentWork.evidence}</textarea>

</div>

<div class="cer-box reasoning">

<h3>🟨 REASONING</h3>

<p>

Explain how your evidence
supports your claim.

</p>

<textarea
placeholder="This evidence supports my claim because..."
oninput="updateWork('reasoning',this.value)"
>${studentWork.reasoning}</textarea>

</div>

<h3>✅ CER Checklist</h3>

<p>☐ I answered the question.</p>

<p>☐ I used evidence from the investigation.</p>

<p>☐ I included scientific data.</p>

<p>☐ I explained how my evidence supports my claim.</p>

${navigation("elaborate","notebook")}

</div>

`;

}


/* =====================================================
   SCIENCE NOTEBOOK
===================================================== */

function notebook() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>📓 MY SCIENCE NOTEBOOK</h2>

<p>

Your work is automatically saved
on this device.

</p>

<div class="notebook">

<h3>🔎 My Prediction</h3>

<p>

${studentWork.prediction || "No response yet."}

</p>

<h3>📖 My Reading Response</h3>

<p>

${studentWork.readingAnswer || "No response yet."}

</p>

<h3>📊 My Data</h3>

<table class="data-table">

<tr>

<th>Temperature</th>

<th>Ending Water</th>

<th>Water Lost</th>

</tr>

<tr>

<td>15°C</td>

<td>${studentWork.end15 || "—"}</td>

<td>${studentWork.lost15 || "—"}</td>

</tr>

<tr>

<td>25°C</td>

<td>${studentWork.end25 || "—"}</td>

<td>${studentWork.lost25 || "—"}</td>

</tr>

<tr>

<td>35°C</td>

<td>${studentWork.end35 || "—"}</td>

<td>${studentWork.lost35 || "—"}</td>

</tr>

</table>

<h3>📈 My Data Analysis</h3>

<p>

${studentWork.pattern || "No response yet."}

</p>

<h3>🧠 Cause & Effect</h3>

<p>

${studentWork.causeEffect || "No response yet."}

</p>

<h3>🌎 My Comparison</h3>

<p>

${studentWork.comparison || "No response yet."}

</p>

<h3>🟥 My Claim</h3>

<p>

${studentWork.claim || "No response yet."}

</p>

<h3>⬜ My Evidence</h3>

<p>

${studentWork.evidence || "No response yet."}

</p>

<h3>🟨 My Reasoning</h3>

<p>

${studentWork.reasoning || "No response yet."}

</p>

</div>

<div class="navigation">

<button
class="secondary"
onclick="show('cer')">

← Back to CER

</button>

</div>

</div>

`;

}


/* =====================================================
   START APP
===================================================== */

show("welcome");

</script>

</body>
</html>
