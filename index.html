<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 9 Science Lab</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #222;
  line-height: 1.6;
}

header {
  background: #a6192e;
  color: white;
  padding: 22px;
  text-align: center;
  border-bottom: 6px solid #7d1021;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin: 5px 0 0;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  border-top: 5px solid #a6192e;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 25px;
  flex-wrap: wrap;
}

button {
  background: #a6192e;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  background: #7d1021;
}

button:disabled {
  background: #bbb;
  cursor: not-allowed;
}

.secondary {
  background: #444;
}

.secondary:hover {
  background: #222;
}

.progress {
  height: 13px;
  background: #ddd;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #a6192e;
  transition: width .3s;
}

h2,
h3 {
  color: #a6192e;
}

.callout {
  background: #fff3f5;
  border-left: 6px solid #a6192e;
  padding: 15px;
  margin: 18px 0;
}

.vocab {
  background: #fafafa;
  border-left: 5px solid #a6192e;
  padding: 14px;
  margin: 12px 0;
}

.visual {
  background: #fff3f5;
  border: 2px solid #efc4cb;
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  font-size: 45px;
  margin: 20px 0;
}

textarea,
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 2px solid #ccc;
  border-radius: 8px;
  margin-top: 7px;
  font-family: Arial, Helvetica, sans-serif;
}

textarea {
  min-height: 110px;
}

textarea:focus,
input:focus {
  outline: none;
  border-color: #a6192e;
}

.option {
  width: 100%;
  text-align: left;
  background: white;
  color: #222;
  border: 2px solid #ccc;
  margin: 8px 0;
}

.option:hover {
  background: #fff3f5;
  color: #7d1021;
}

.correct {
  background: #e2f4e7 !important;
  border-color: #3d9254 !important;
}

.incorrect {
  background: #ffe5e8 !important;
  border-color: #c62828 !important;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
}

.data-table th,
.data-table td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}

.data-table th {
  background: #a6192e;
  color: white;
}

.data-table input {
  width: 100px;
  text-align: center;
}

.cer-box {
  padding: 20px;
  border-radius: 12px;
  margin: 18px 0;
}

.claim {
  background: #fff0f2;
  border-left: 7px solid #a6192e;
}

.evidence {
  background: #f5f5f5;
  border-left: 7px solid #555;
}

.reasoning {
  background: #fff8df;
  border-left: 7px solid #d29a00;
}

.notebook {
  background: white;
  border: 3px solid #a6192e;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.notebook h3 {
  border-bottom: 2px solid #eee;
  padding-bottom: 5px;
}

.help {
  background: #fff4e5;
  border-left: 6px solid #e19a00;
  padding: 16px;
  margin-top: 15px;
}

.extension {
  background: #eef6ff;
  border-left: 6px solid #2474b5;
  padding: 16px;
  margin-top: 15px;
}

.center {
  text-align: center;
}

.success {
  color: #26733a;
  font-weight: bold;
}

@media(max-width:700px) {

  header h1 {
    font-size: 27px;
  }

  .card {
    padding: 18px;
  }

  .navigation {
    flex-direction: column;
  }

  .data-table {
    font-size: 13px;
  }

}

</style>
</head>

<body>

<header>

<h1>🔬 SCIENCE LAB</h1>

<p>Earth & Universe Science • Grade 9</p>

</header>

<div class="container">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="app"></div>

</div>

<script>

/* =====================================================
   STUDENT WORK
===================================================== */

const STORAGE_KEY = "grade9ScienceWeek1";

let studentWork =
JSON.parse(localStorage.getItem(STORAGE_KEY)) || {

prediction: "",
readingAnswer: "",

end15: "",
lost15: "",

end25: "",
lost25: "",

end35: "",
lost35: "",

pattern: "",
causeEffect: "",
comparison: "",

claim: "",
evidence: "",
reasoning: ""

};


/* =====================================================
   SAVE WORK
===================================================== */

function saveWork() {

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(studentWork)
);

}


function updateWork(field, value) {

studentWork[field] = value;

saveWork();

}


/* =====================================================
   LESSON STEPS
===================================================== */

const steps = [

"welcome",
"engage",
"reading",
"explore",
"explain",
"elaborate",
"cer",
"notebook"

];

let currentStep = 0;


/* =====================================================
   SHOW SCREEN
===================================================== */

function show(step) {

currentStep = steps.indexOf(step);

updateProgress();

if(step === "welcome") welcome();
if(step === "engage") engage();
if(step === "reading") reading();
if(step === "explore") explore();
if(step === "explain") explain();
if(step === "elaborate") elaborate();
if(step === "cer") cer();
if(step === "notebook") notebook();

}


/* =====================================================
   PROGRESS BAR
===================================================== */

function updateProgress() {

let percent =
(currentStep / (steps.length - 1)) * 100;

document.getElementById(
"progressBar"
).style.width = percent + "%";

}


/* =====================================================
   NAVIGATION
===================================================== */

function navigation(previous, next) {

let backButton = previous
? `<button class="secondary"
onclick="show('${previous}')">
← Back
</button>`
: `<button disabled>← Back</button>`;

let nextButton = next
? `<button
onclick="show('${next}')">
Continue →
</button>`
: "";

return `

<div class="navigation">

${backButton}

<button
class="secondary"
onclick="show('notebook')">

📓 My Science Notebook

</button>

${nextButton}

</div>

`;

}


/* =====================================================
   WELCOME
===================================================== */

function welcome() {

document.getElementById("app").innerHTML = `

<div class="card center">

<h2>UNIT 1 • WEEK 1</h2>

<h1>Where Did the Water Go?</h1>

<div class="visual">

💧 → ☁️

</div>

<h2>Essential Question</h2>

<p>

<strong>
How do scientists use evidence
to explain changes in the natural world?
</strong>

</p>

<p>

Today you will read, investigate,
practice math, analyze data,
and write a scientific explanation.

</p>

<button onclick="show('engage')">

Begin Investigation →

</button>

</div>

`;

}


/* =====================================================
   ENGAGE
===================================================== */

function engage() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🔎 ENGAGE — The Mystery</h2>

<p>

A scientist places exactly
<strong>100 mL</strong>
of water in an open container.

</p>

<div class="visual">

🧪 💧

<br>

<strong>100 mL</strong>

</div>

<p>

Twenty-four hours later,
the scientist measures the water again.

</p>

<div class="visual">

🧪 💧

<br>

<strong>77 mL</strong>

</div>

<div class="callout">

<strong>
23 mL of water is no longer
in the container.
</strong>

</div>

<h2>🤔 Where did the water go?</h2>

<textarea
placeholder="I think the water..."
oninput="updateWork('prediction',this.value)"
>${studentWork.prediction}</textarea>

${navigation(null,"reading")}

</div>

`;

}


/* =====================================================
   READING
===================================================== */

function reading() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>📖 READ — Scientific Reading</h2>

<p>

Your teacher will provide a printed
grade-level scientific reading about
<strong>evaporation and the water cycle</strong>.

</p>

<div class="callout">

<strong>Reading Strategy</strong>

<p>
As you read, look for:
</p>

<p>🟥 Main idea</p>
<p>🟦 Important details</p>
<p>🟩 Evidence explaining evaporation</p>

</div>

<h3>Vocabulary</h3>

<div class="vocab">

<strong>Evaporation</strong>

<br>

The process in which a liquid
changes into a gas.

</div>

<div class="vocab">

<strong>Water vapor</strong>

<br>

Water in its gas state.

</div>

<div class="vocab">

<strong>Evidence</strong>

<br>

Information that supports
a scientific explanation.

</div>

<h3>Reading Response</h3>

<p>

What happens to water during evaporation?

</p>

<textarea
placeholder="During evaporation..."
oninput="updateWork('readingAnswer',this.value)"
>${studentWork.readingAnswer}</textarea>

<div class="callout">

<strong>Writing Frame:</strong>

<p>

During evaporation, water __________
because __________.

</p>

</div>

${navigation("engage","explore")}

</div>

`;

}


/* =====================================================
   TRIAL RESULTS
===================================================== */

const trialResults = {

15: 96,
25: 87,
35: 75

};


/* =====================================================
   EXPLORE
===================================================== */

function explore() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🔬 EXPLORE — Virtual Investigation</h2>

<h3>Investigation Question</h3>

<p>

<strong>
How does temperature affect
the amount of water that evaporates?
</strong>

</p>

<div class="callout">

<strong>Your job:</strong>

<p>1. Run all three trials.</p>

<p>2. Record the ending water.</p>

<p>3. Calculate water lost.</p>

<p>4. Analyze the data.</p>

</div>

<div class="visual">

🌡️ &nbsp; 🧪 &nbsp; 💧

</div>

<h3>Step 1 — Run the Trials</h3>

<p>

Click each temperature.
Record the ending water
in the table.

</p>

<button onclick="runTrial(15)">
15°C
</button>

<button onclick="runTrial(25)">
25°C
</button>

<button onclick="runTrial(35)">
35°C
</button>

<div id="trialResult"></div>

<hr>

<h3>Step 2 — Record Your Data</h3>

<table class="data-table">

<tr>

<th>Temperature</th>

<th>Starting Water</th>

<th>Ending Water</th>

<th>Water Lost</th>

</tr>

<tr>

<td><strong>15°C</strong></td>

<td>100 mL</td>

<td>

<input
type="number"
value="${studentWork.end15}"
placeholder="mL"
oninput="updateWork('end15',this.value)"
>

</td>

<td>

<input
type="number"
value="${studentWork.lost15}"
placeholder="mL"
oninput="updateWork('lost15',this.value)"
>

</td>

</tr>

<tr>

<td><strong>25°C</strong></td>

<td>100 mL</td>

<td>

<input
type="number"
value="${studentWork.end25}"
placeholder="mL"
oninput="updateWork('end25',this.value)"
>

</td>

<td>

<input
type="number"
value="${studentWork.lost25}"
placeholder="mL"
oninput="updateWork('lost25',this.value)"
>

</td>

</tr>

<tr>

<td><strong>35°C</strong></td>

<td>100 mL</td>

<td>

<input
type="number"
value="${studentWork.end35}"
placeholder="mL"
oninput="updateWork('end35',this.value)"
>

</td>

<td>

<input
type="number"
value="${studentWork.lost35}"
placeholder="mL"
oninput="updateWork('lost35',this.value)"
>

</td>

</tr>

</table>

<div class="callout">

<h3>➖ Math Formula</h3>

<p>

<strong>

Starting Water − Ending Water
= Water Lost

</strong>

</p>

<p>

Example:

</p>

<p>

100 mL − 90 mL = <strong>10 mL</strong>

</p>

</div>

<button onclick="checkData()">

✓ Check My Data

</button>

<div id="dataFeedback"></div>

<hr>

<h3>📊 Step 3 — Compare the Data</h3>

<p>

How many more milliliters of water
were lost at 35°C than at 15°C?

</p>

<input
type="number"
id="comparisonMath"
placeholder="Answer in mL"
>

<button onclick="checkComparison()">

Check Answer

</button>

<div id="comparisonFeedback"></div>

<hr>

<h3>📈 Step 4 — Analyze the Graph</h3>

<p>

The graph shows the amount of
water lost at each temperature.

</p>

<div id="graph">

${createGraph()}

</div>

<p>

<strong>

What pattern do you notice?

</strong>

</p>

<textarea
placeholder="The data show that..."
oninput="updateWork('pattern',this.value)"
>${studentWork.pattern}</textarea>

<div class="callout">

<strong>Writing Frame:</strong>

<p>

As temperature increased,
the amount of water lost __________.

</p>

</div>

<hr>

<h3>💯 Step 5 — Percentage Challenge</h3>

<p>

The container started with
100 mL of water.

At 35°C, 25 mL was lost.

</p>

<p>

What percentage of the original
water was lost?

</p>

<input
type="number"
id="percentageAnswer"
placeholder="%"
>

<button onclick="checkPercentage()">

Check Challenge

</button>

<div id="percentageFeedback"></div>

${navigation("reading","explain")}

</div>

`;

}


/* =====================================================
   RUN TRIAL
===================================================== */

function runTrial(temp) {

let ending = trialResults[temp];

document.getElementById(
"trialResult"
).innerHTML = `

<div class="callout">

<h3>Trial: ${temp}°C</h3>

<p>

The ending water is:

<strong>${ending} mL</strong>

</p>

<p>

📝 Record <strong>${ending} mL</strong>
in your table.

</p>

<p>

Now calculate:

</p>

<p>

<strong>

100 − ${ending} = ?

</strong>

</p>

</div>

`;

}


/* =====================================================
   CHECK DATA
===================================================== */

function checkData() {

let answers = {

end15: 96,
lost15: 4,

end25: 87,
lost25: 13,

end35: 75,
lost35: 25

};

let correct = true;

for(let key in answers) {

if(Number(studentWork[key]) !== answers[key]) {

correct = false;

}

}

let feedback =
document.getElementById("dataFeedback");

if(correct) {

feedback.innerHTML = `

<div class="extension">

<strong>⭐ Excellent!</strong>

<p>

Your ending-water measurements
and calculations are correct.

</p>

<p>

You are ready to analyze the data.

</p>

</div>

`;

}

else {

feedback.innerHTML = `

<div class="help">

<strong>🧠 Let's Practice</strong>

<p>

Remember:

</p>

<p>

<strong>

Starting Water − Ending Water
= Water Lost

</strong>

</p>

<p>

Start with 15°C:

</p>

<p>

100 − 96 = ?

</p>

<p>

Check your calculation and try again.

</p>

</div>

`;

}

}


/* =====================================================
   GRAPH
===================================================== */

function createGraph() {

return `

<div style="
height:280px;
display:flex;
align-items:flex-end;
justify-content:space-around;
border-left:3px solid #333;
border-bottom:3px solid #333;
padding:10px;
margin:20px 10px;
">

<div style="text-align:center">

<div style="
height:40px;
width:60px;
background:#a6192e;
margin:auto;
"></div>

<strong>4 mL</strong>

<br>

15°C

</div>

<div style="text-align:center">

<div style="
height:120px;
width:60px;
background:#a6192e;
margin:auto;
"></div>

<strong>13 mL</strong>

<br>

25°C

</div>

<div style="text-align:center">

<div style="
height:220px;
width:60px;
background:#a6192e;
margin:auto;
"></div>

<strong>25 mL</strong>

<br>

35°C

</div>

</div>

<p class="center">

<strong>Temperature → Water Lost</strong>

</p>

`;

}


/* =====================================================
   COMPARE DATA
===================================================== */

function checkComparison() {

let answer =
Number(
document.getElementById("comparisonMath").value
);

let feedback =
document.getElementById("comparisonFeedback");

if(answer === 21) {

feedback.innerHTML = `

<div class="extension">

<strong>⭐ Correct!</strong>

<p>

25 − 4 = <strong>21 mL</strong>

</p>

<p>

At 35°C, 21 more milliliters
of water were lost than at 15°C.

</p>

<h4>Extension Question</h4>

<p>

Why do you think more water
was lost at the higher temperature?

</p>

<textarea></textarea>

</div>

`;

}

else {

feedback.innerHTML = `

<div class="help">

<strong>🧠 Let's Practice</strong>

<p>

Find the two values:

</p>

<p>

35°C → 25 mL lost

</p>

<p>

15°C → 4 mL lost

</p>

<p>

Subtract:

</p>

<p>

<strong>

25 − 4 = ?

</strong>

</p>

<p>

Try again.

</p>

</div>

`;

}

}


/* =====================================================
   PERCENTAGE
===================================================== */

function checkPercentage() {

let answer =
Number(
document.getElementById("percentageAnswer").value
);

let feedback =
document.getElementById("percentageFeedback");

if(answer === 25) {

feedback.innerHTML = `

<div class="extension">

<strong>⭐ Challenge Complete!</strong>

<p>

25 mL out of 100 mL is
<strong>25%</strong>.

</p>

<p>

You used scientific data
to solve a percentage problem.

</p>

</div>

`;

}

else {

feedback.innerHTML = `

<div class="help">

<strong>🧠 Percentage Hint</strong>

<p>

Use:

</p>

<p>

<strong>

Part ÷ Whole × 100

</strong>

</p>

<p>

Try:

</p>

<p>

25 ÷ 100 × 100

</p>

</div>

`;

}

}


/* =====================================================
   EXPLAIN
===================================================== */

function explain() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🧠 EXPLAIN</h2>

<h3>Observation or Inference?</h3>

<div class="vocab">

<strong>Observation</strong>

<br>

Something you directly see,
measure, or record.

</div>

<div class="vocab">

<strong>Inference</strong>

<br>

An explanation based on
observations and evidence.

</div>

<p>

A thermometer reads 25°C.

Is this an observation or an inference?

</p>

<button
class="option"
onclick="answerExplain(this,true)">

Observation

</button>

<button
class="option"
onclick="answerExplain(this,false)">

Inference

</button>

<div id="explainFeedback"></div>

<h3>Cause and Effect</h3>

<p>

Complete the sentence:

</p>

<p>

<strong>

As temperature increased,
________________________.

</strong>

</p>

<textarea
placeholder="As temperature increased..."
oninput="updateWork('causeEffect',this.value)"
>${studentWork.causeEffect}</textarea>

${navigation("explore","elaborate")}

</div>

`;

}


/* =====================================================
   EXPLAIN QUESTION
===================================================== */

function answerExplain(button, correct) {

if(correct) {

button.classList.add("correct");

document.getElementById(
"explainFeedback"
).innerHTML = `

<div class="extension">

<strong>⭐ Correct!</strong>

<p>

A thermometer reading is something
we can directly measure.

</p>

<h4>Challenge Question</h4>

<p>

Why is the statement
“the water evaporated”
an inference rather than a direct observation?

</p>

<textarea></textarea>

</div>

`;

}

else {

button.classList.add("incorrect");

document.getElementById(
"explainFeedback"
).innerHTML = `

<div class="help">

<strong>🧠 Need Help?</strong>

<p>

An observation is something
you can directly see or measure.

</p>

<p>

A thermometer reading is a measurement.

</p>

<p>

Try again.

</p>

</div>

`;

}

}


/* =====================================================
   ELABORATE
===================================================== */

function elaborate() {

document.getElementById("app").innerHTML = `

<div class="card">

<h2>🌎 ELABORATE — Apply Your Thinking</h2>

<p>

Two containers each begin with
100 mL of water.

</p>

<table class="data-table">

<tr>

<th>Location</th>

<th>Starting Water</th>

<th>Ending Water</th>

<th>Water Lost</th>

</tr>

<tr>

<td>☀️ Sunny Window</td>

<td>100 mL</td>

<td>72 mL</td>

<td>28 mL</td>

</tr>

<tr>

<td>🗄️ Cabinet</td>

<td>100 mL</td>

<td>91 mL</td>

<td>9 mL</td>

</tr>

</table>

<h3>➖ Math Challenge</h3>

<p>

How much more water was lost
in the sunny window?

</p>

<p>

<strong>

28 − 9 = ?

</strong>

</p>

<input
type="number"
id="mathChallenge"
placeholder="Answer in mL"
>

<button onclick="checkMath()">

Check Answer

</button>

<div id="mathFeedback"></div>

<h3>✍️ Writing</h3>

<p>

Compare the two locations
using their data.

</p>

<textarea
placeholder="The sunny window..."
oninput="updateWork('comparison',this.value)"
>${studentWork.comparison}</textarea>

<div class="callout">

<strong>Writing Frame:</strong>

<p>

More water was lost in the __________
because the data show __________.

</p>

</div>

${navigation("explain","cer")}

</div>

`;

}


/* =====================================================
   ELABORATE MATH
===================================================== */

function checkMath() {

let answer =
Number(
document.getElementById("mathChallenge").value
);

let feedback =
document.getElementById("mathFeedback");

if(answer === 19) {

feedback.innerHTML = `

<div class="extension">

<strong>⭐ Correct!</strong>

<p>

28 − 9 = <strong>19 mL</strong>

</p>

<h4>Challenge</h4>

<p>

What percentage of the original
100 mL was lost in the sunny window?

</p>

<p>

Hint: 28 ÷ 100 × 100

</p>

</div>

`;

}

else {

</p>

<p>

}
